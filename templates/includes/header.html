{% load static %}
<header class="site-header" id="site-header">

    <div class="site-header__container">

        <!-- Logo -->
        <a href="{% url 'Home:Home' %}" class="site-header__logo">
            <span>سها آذرین سپهر</span>
        </a>


        <!-- Navigation -->
        <nav class="site-header__nav" id="site-navigation">

            <ul class="site-header__menu">

                <li>
                    <a href="{% url 'Home:Home' %}#top">
                        خانه
                    </a>
                </li>

                <li>
                    <a href="{% url 'Home:Home' %}#services">
                        خدمات
                    </a>
                </li>

                <li>
                    <a href="{% url 'Home:Home' %}#courses">
                        خدمت‌ها
                    </a>
                </li>

                <li>
                    <a href="{% url 'Home:Home' %}#team">
                        تیم ما
                    </a>
                </li>

                <li>
                    <a href="{% url 'portfolio:project_list' %}">
                        نمونه‌کارها
                    </a>
                </li>

                <li>
                    <a href="{% url 'Home:Home' %}#contact">
                        تماس با ما
                    </a>
                </li>

            </ul>

        </nav>


        <!-- Search -->
        <div class="site-header__search">

            <form action="{% url "global_search:search" %}" method="get">

                <input
                    type="search"
                    name="q"
                    value="{{ request.GET.q|default:'' }}"
                    placeholder="جستجو..."
                    aria-label="جستجو"
                >

                <button type="submit" aria-label="جستجو">
                    <i class="fa fa-search"></i>
                </button>

            </form>

        </div>


        <!-- Mobile Button -->
        <button
            type="button"
            class="site-header__toggle"
            id="site-header-toggle"
            aria-label="باز کردن منو"
            aria-expanded="false"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </div>

</header>
